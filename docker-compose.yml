services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: byte_boards_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    networks:
      - app_network
    extra_hosts:
      - "cine406.go.ro:host-gateway"
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: byte_boards_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
