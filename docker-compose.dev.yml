services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: byte_boards_backend
    restart: unless-stopped
    # db push syncs schema without needing migration files (good for local dev)
    command: sh -c "npx prisma db push && node dist/index.js"
    environment:
      DATABASE_URL: "postgresql://admin:admin@db:5432/postgres?schema=public"
      JWT_SECRET: "byte-boards-secret-change-in-production"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: byte_boards_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
