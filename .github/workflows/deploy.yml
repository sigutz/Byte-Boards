name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DATABASE_URL,JWT_SECRET,VITE_API_BASE_URL
          script: |
            set -e

            if [ ! -d "$HOME/bytenboard" ]; then
              echo "── Repository not found. Cloning... ──"
              git clone https://github.com/${{ github.repository }}.git ~/bytenboard
              cd ~/bytenboard
            else
              echo "── Repository found. Pulling latest code... ──"
              cd ~/bytenboard
              git fetch --all
              git reset --hard origin/main
            fi

            echo "── Writing .env from secrets ──"
            printf "DATABASE_URL=%s\nJWT_SECRET=%s\nVITE_API_BASE_URL=%s\n" "$DATABASE_URL" "$JWT_SECRET" "$VITE_API_BASE_URL" > .env

            echo "── Bringing down old containers ──"
            docker compose down --remove-orphans

            echo "── Building and starting containers ──"
            docker compose up --build -d

            echo "── Removing unused Docker resources ──"
            docker image prune -f

            echo "Deployment complete"
